<!-- WADAH POPUP & DIALOG GLOBAL -->

<!-- MODAL INPUT DISKON NOMINAL (RUPIAH) -->
<div class="modal-wrapper" id="discountModal">
  <div class="modal-box modal-sm" id="discountModalBox">
    <div class="modal-head">
      <h3>Input Diskon Pesanan</h3>
      <button class="close-btn" id="btnCloseDiscountModal">&times;</button>
    </div>
    <div class="modal-content">
      <div class="discount-quick-pills">
        <button type="button" class="btn-quick-disc" data-val="500">Rp 500</button>
        <button type="button" class="btn-quick-disc" data-val="1000">Rp 1.000</button>
        <button type="button" class="btn-quick-disc" data-val="2000">Rp 2.000</button>
        <button type="button" class="btn-quick-disc" data-val="5000">Rp 5.000</button>
      </div>
      <div class="form-group" style="margin-top: 12px;">
        <label for="inputDiscountNominal">Nominal Potongan (Rp):</label>
        <input type="text" id="inputDiscountNominal" placeholder="Rp 0" inputmode="numeric" autocomplete="off" />
        <small style="font-size: 10.5px; color: var(--text-secondary); margin-top: 4px;">
          * Otomatis dibulatkan ke kelipatan Rp 500 terdekat untuk menghindari pecahan receh.
        </small>
      </div>
      <button type="button" class="btn-threads-primary block" id="btnApplyDiscount" style="margin-top: 14px;">
        Terapkan Diskon
      </button>
    </div>
  </div>
</div>

<!-- LAMAN PENUH: PILIH MEMBER PELANGGAN KASIR -->
<div class="full-page-screen" id="posMemberPickerScreen">
  <div class="page-screen-header">
    <button class="btn-back-screen" id="btnBackPosMemberPicker" type="button">
      <svg class="mono-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Kembali</span>
    </button>
    <h3>Pilih Member Pelanggan</h3>
    <div style="width: 32px;"></div>
  </div>

  <div class="page-screen-body">
    <div class="page-form-container">
      <div class="input-field-group">
        <label for="posMemberSearchInput">Cari Pelanggan</label>
        <div class="input-icon-wrap">
          <svg class="mono-icon input-left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="posMemberSearchInput" placeholder="Ketik nama atau No. WhatsApp..." autocomplete="off" />
        </div>
      </div>

      <div class="member-picker-list" id="posMemberPickerList" style="max-height: none; overflow: visible; margin-top: 6px;"></div>
    </div>
  </div>
</div>

<!-- MODAL DIALOG BERTEMA UNIVERSAL -->
<div class="modal-wrapper" id="appThemeDialogModal">
  <div class="modal-box modal-dialog">
    <div class="dialog-icon-container" id="dialogIconBox"></div>
    <h3 id="dialogTitle" class="dialog-title">Notifikasi</h3>
    <p id="dialogMessage" class="dialog-desc"></p>
    
    <div id="dialogInputWrap" class="dialog-input-wrapper hidden">
      <input type="text" id="dialogInputVal" class="dialog-input" />
    </div>

    <div class="dialog-action-buttons">
      <button type="button" class="btn-threads-secondary" id="btnDialogCancel">Batal</button>
      <button type="button" class="btn-threads-primary" id="btnDialogConfirm">OK</button>
    </div>
  </div>
</div>

<!-- MODAL KONFIRMASI KELUAR APLIKASI -->
<div class="exit-modal-backdrop" id="exitConfirmModal">
  <div class="exit-dialog-card">
    <h3>Keluar Aplikasi?</h3>
    <p>Apakah Anda yakin ingin menutup sesi kasir Kholif Store?</p>
    <div class="exit-dialog-actions">
      <button class="btn-exit-cancel" id="btnCancelExit">Batal</button>
      <button class="btn-exit-confirm" id="btnConfirmExit">Keluar</button>
    </div>
  </div>
</div>
