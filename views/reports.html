<!-- VIEW: LAPORAN PENJUALAN -->
<section id="view-reports" class="app-view">
  <div class="threads-container">
    <div class="view-action-header">
      <div>
        <h2>Laporan Penjualan</h2>
        <p>Performa ringkas transaksi dan audit kasir.</p>
      </div>
    </div>

    <div class="report-stats-grid">
      <div class="stat-card">
        <small>Total Omzet</small>
        <h3 id="statTotalRevenue">Rp 0</h3>
      </div>
      <div class="stat-card">
        <small>Transaksi Sukses</small>
        <h3 id="statTotalTransactions">0</h3>
      </div>
      <div class="stat-card">
        <small>Paling Laris</small>
        <h3 id="statBestSeller">-</h3>
      </div>
    </div>

    <div class="threads-card" style="margin-top: 16px;">
      <div class="table-filter-bar">
        <input type="text" id="reportSearch" placeholder="Cari no. struk, kasir, member, nominal..." autocomplete="off" />
        <div class="inventory-stat-summary">Data: <strong id="repCountTotal">0</strong></div>
      </div>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Struk</th>
              <th>Waktu</th>
              <th>Kasir &amp; Member</th>
              <th>Total Belanja</th>
              <th>Status</th>
              <th style="text-align: right;">Kelola</th>
            </tr>
          </thead>
          <tbody id="reportsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- LAMAN PENUH: EDIT & RINCIAN TRANSAKSI -->
<div class="full-page-screen" id="editTrxPageScreen">
  <div class="page-screen-header">
    <button class="btn-back-screen" id="btnBackEditTrxPage">
      <svg class="mono-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Laporan</span>
    </button>
    <h3>Edit &amp; Rincian Transaksi</h3>
    <div style="width: 32px;"></div>
  </div>

  <div class="page-screen-body">
    <form id="editTrxForm" onsubmit="return false;" class="page-form-container">
      <input type="hidden" id="editTrxId" />
      <div class="form-group">
        <label>Nomor Struk</label>
        <input type="text" id="editTrxDisplayId" disabled style="background:#f1f5f9; color:var(--text-secondary);" />
      </div>

      <div class="form-group-row">
        <div class="form-group">
          <label for="editTrxTime">Waktu</label>
          <input type="text" id="editTrxTime" placeholder="JJ:MM" required />
        </div>
        <div class="form-group">
          <label for="editTrxCashier">Kasir</label>
          <input type="text" id="editTrxCashier" required />
        </div>
      </div>

      <div class="form-group" style="margin-top: 6px;">
        <label>Rincian Barang Terbeli</label>
        <div class="trx-items-card-list" id="editTrxItemsList"></div>
      </div>

      <div class="form-group-row">
        <div class="form-group">
          <label for="editTrxTotal">Total Belanja (Rp)</label>
          <input type="number" id="editTrxTotal" min="0" required />
        </div>
        <div class="form-group">
          <label for="editTrxStatus">Status</label>
          <select id="editTrxStatus" required>
            <option value="Sukses">Sukses</option>
            <option value="Dibatalkan">Dibatalkan</option>
          </select>
        </div>
      </div>

      <div class="receipt-action-buttons" style="margin-top: 14px;">
        <button type="button" class="btn-threads-secondary block" id="btnReprintTrxEdit">Cetak Ulang Nota</button>
        <button type="button" class="btn-whatsapp-action block" id="btnSendWaTrxEdit">Kirim ke WhatsApp Member</button>
      </div>

      <button type="submit" id="btnSaveEditTrx" class="btn-threads-primary block" style="margin-top: 14px;">
        Simpan Perubahan
      </button>
    </form>
  </div>
</div>
